type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  name:
    type: string
    description: Contact name
    example: Jone Doe
  phoneNumber:
    type: string
    description: Contact phone phone number
    example: '+380112223345'
  email:
    type: string
    description: Contact email
    example: mail@mail.com
  isFavorite:
    type: boolean
    description: Contact is favorite
    example: true
    default: false
  contactType:
    type: string
    description: Type of contact
    enum: ['work', 'home', 'personal']
    default: personal
  photo:
    type: string
    format: binary
    description: Photo of contact
